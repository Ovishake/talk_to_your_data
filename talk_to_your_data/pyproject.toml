[project]
name = "nlq-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "databricks-sdk>=0.60",
  "pydantic>=2.8",
  "pydantic-ai-slim[openai]>=1.0",
  "openai>=1.54",
  "streamlit>=1.40",
  "plotly>=5.24",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "mlflow[databricks]>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff.lint]
# EXE002: Databricks workspace files are always rwxrwxrwx; chmod is a no-op
ignore = ["EXE002"]

[tool.pytest.ini_options]
pythonpath = ["."]